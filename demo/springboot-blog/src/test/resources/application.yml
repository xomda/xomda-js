# Test profile: H2 in PostgreSQL compatibility mode so `mvn test` runs
# without Docker. Flyway is disabled here — its V1__init.sql targets real
# Postgres and is verified by Vitest in-memory render assertions. Tests
# instead let Hibernate create the schema from the generated entities,
# which is what we actually want to validate end-to-end.
spring:
  application:
    name: blog-service-test
  datasource:
    url: jdbc:h2:mem:blog_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: false
