# Test profile: H2 in-memory, Flyway off, Hibernate creates the schema.
# The V1__init.sql migration is verified separately by Vitest in-memory
# render assertions (it targets real Postgres). What we actually want to
# validate here is that the generated Panache entities + JAX-RS resources
# round-trip through the full Quarkus container.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:todo_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=

%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.flyway.active=false
